services:
  auth-service:
    environment:
      JWT_JWK_SET_URI: http://auth-service:8081/oauth2/jwks
      PRODUCT_SERVICE_URL: http://product-service:8082
      SHIPPING_SERVICE_URL: http://shipping-service:8086
  product-service:
    environment:
      JWT_JWK_SET_URI: http://auth-service:8081/oauth2/jwks
      PRODUCT_SERVICE_URL: http://product-service:8082
      SHIPPING_SERVICE_URL: http://shipping-service:8086
    depends_on:
      auth-service:
        condition: service_healthy
  order-service:
    environment:
      JWT_JWK_SET_URI: http://auth-service:8081/oauth2/jwks
      PRODUCT_SERVICE_URL: http://product-service:8082
      SHIPPING_SERVICE_URL: http://shipping-service:8086
    depends_on:
      auth-service:
        condition: service_healthy
  inventory-service:
    environment:
      JWT_JWK_SET_URI: http://auth-service:8081/oauth2/jwks
      PRODUCT_SERVICE_URL: http://product-service:8082
      SHIPPING_SERVICE_URL: http://shipping-service:8086
    depends_on:
      auth-service:
        condition: service_healthy
  shipping-service:
    environment:
      JWT_JWK_SET_URI: http://auth-service:8081/oauth2/jwks
      PRODUCT_SERVICE_URL: http://product-service:8082
      SHIPPING_SERVICE_URL: http://shipping-service:8086
    depends_on:
      auth-service:
        condition: service_healthy
  kong:
    volumes:
      - ./kong-gateway/config/kong.docker.yml:/etc/kong/kong.yml:ro
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
