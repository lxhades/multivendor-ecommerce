# Full-Docker upstreams; keep routes/plugins aligned with kong.yml.
_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-api
        paths:
          - '~/auth(?:/|$)'
          - '~/api/users/admin(?:/|$)'
          - '~/oauth2/jwks$'
        strip_path: false

  - name: product-service
    url: http://product-service:8082
    routes:
      - name: product-api
        paths:
          - '~/shops(?:/|$)'
          - '~/categories(?:/|$)'
          - '~/api/products(?:/|$)'
          - '~/api/shops(?:/|$)'
          - '~/api/categories(?:/|$)'
          - '~/internal/products/variants(?:/|$)'
          - '~/api/media(?:/|$)'
        strip_path: false

      - name: product-media-route
        paths:
          - /media
        strip_path: false
        methods:
          - GET

  - name: order-service
    url: http://order-service:8084
    routes:
      - name: order-api
        paths:
          - '~/api/checkouts(?:/|$)'
          - '~/api/orders(?:/|$)'
          - '~/api/reviews(?:/|$)'
        strip_path: false

  - name: inventory-service
    url: http://inventory-service:8085
    routes:
      - name: inventory-api
        paths:
          - '~/api/inventories(?:/|$)'
          - '~/api/reservations(?:/|$)'
        strip_path: false

  - name: shipping-service
    url: http://shipping-service:8086
    routes:
      - name: shipping-api
        paths:
          - '~/api/shipments(?:/|$)'
        strip_path: false


plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Idempotency-Key
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 100
      policy: local
      limit_by: ip
