server:
  port: ${SERVER_PORT:8086}
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:auth-service}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
  application:
    name: shipping-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/shipping_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  # Flyway creates schema and initial data once per database.
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
    default-schema: public
    encoding: UTF-8
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: shipping-order-shipped-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
shipping:
  poll-ms: 1000
  kafka:
    order-shipped-topic: order.shipped.v1
    status-topic: shipping.status.v1
  outbox:
    poll-ms: 1000
