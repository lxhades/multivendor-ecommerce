spring.application.name=inventory-service
server.port=${SERVER_PORT:8085}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/inventory_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Kafka Consumer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false 
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Reservation and event publishing
inventory.reservation.ttl-minutes=15
inventory.outbox.poll-delay-ms=1000
inventory.expiration.poll-delay-ms=60000

# Product integration
inventory.product.base-url=${PRODUCT_SERVICE_URL:http://localhost:8080}
logging.level.com.inventory_service=INFO

# Security / service authentication
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/oauth2/jwks

# Kafka Topics
inventory.product.service-token=${PRODUCT_SERVICE_TOKEN:}
inventory.kafka.product-topic=product.inventory-init.v1
inventory.kafka.outbox-topic=inventory.events.v1