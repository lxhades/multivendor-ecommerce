spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/oauth2/jwks
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 100000
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      group-id: order-inventory-result-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
server:
  port: ${SERVER_PORT:8084}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    internal-token: ${PRODUCT_SERVICE_INTERNAL_TOKEN:test123}
  shipping:
    base-url: ${SHIPPING_SERVICE_URL:http://localhost:8086}

order:
  kafka:
    inventory-topic: inventory.reserve.requested.v1
    inventory-result-topic: inventory.reservation.result.v1
    inventory-release-topic: inventory.release.requested.v1
    shipped-topic: order.shipped.v1
    shipping-status-topic: shipping.status.v1

  outbox:
    poll-delay-ms: 3000

