spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Flyway creates schema and initial data once per database.
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
    placeholders:
      catalogMediaBaseUrl: ${CATALOG_MEDIA_BASE_URL:http://localhost:8000}
    default-schema: public
    encoding: UTF-8
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:auth-service}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 100000
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      group-id: order-inventory-result-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
server:
  port: ${SERVER_PORT:8084}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    internal-token: ${PRODUCT_SERVICE_INTERNAL_TOKEN:test123}
  shipping:
    base-url: ${SHIPPING_SERVICE_URL:http://localhost:8086}

order:
  kafka:
    inventory-topic: inventory.reserve.requested.v1
    inventory-result-topic: inventory.reservation.result.v1
    inventory-release-topic: inventory.release.requested.v1
    shipped-topic: order.shipped.v1
    delivered-topic: order.delivered.v1
    shipping-status-topic: shipping.status.v1

  outbox:
    poll-delay-ms: 3000

