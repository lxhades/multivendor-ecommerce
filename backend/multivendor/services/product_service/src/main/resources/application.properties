
# SPRING CORE & DEVTOOLS

spring.application.name=product_service
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s


# DATASOURCE & JPA

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/product_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh


# SECURITY (OAUTH2)

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:auth-service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/oauth2/jwks}


# KAFKA

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.group-id=product-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# SERVLET (MULTIPART)

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB


# CUSTOM PROPERTIES (PRODUCT)

product.kafka.inventory-topic=product.inventory-init.v1
product.kafka.delivered-topic=order.delivered.v1
product.outbox.poll-delay-ms=3000


# SERVER & SWAGGER

server.port=${SERVER_PORT:8082}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# MEDIA CONFIGURATION

app.media.storage-path=${APP_MEDIA_STORAGE_PATH:./uploads}
app.media.public-base-url=${APP_MEDIA_PUBLIC_BASE_URL:http://localhost:8000}
app.media.max-file-size=10MB
app.media.allowed-mime-types=image/jpeg,image/png,image/webp,video/mp4
# Flyway creates schema and initial data once per database.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.flyway.placeholders.catalogMediaBaseUrl=${CATALOG_MEDIA_BASE_URL:http://localhost:8000}
spring.flyway.default-schema=public
spring.flyway.encoding=UTF-8
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Readiness is HTTP + application availability + database, not just an open TCP port.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
