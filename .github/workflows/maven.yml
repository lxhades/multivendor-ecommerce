name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./backend/multivendor
        run: mvn -B -ntp clean package -Dmaven.test.skip=true

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          # Đổi tên thành app-jars vì sẽ có nhiều file jar được upload
          name: app-jars
          path: '**/target/*.jar' 
          if-no-files-found: error
